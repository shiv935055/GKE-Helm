global:
  environment: uat
  gcpProjectId: plutos-bbps-uat
  namespace: helm-yb-cou




ingress:
  enabled: true
  name: yb-cou-switch-uat
  className: "gce-internal"
  host: yb-uat-cou-switch.plutosone.in




backend:
  name: yb-cou-switch
  envmountpath: /usr/src/app/.env
  gcpSecretName: yb-cou-switch-uat-env
  reloader: true
  replicaCount: 1
  image:
    repository: asia-south1-docker.pkg.dev/plutos-bbps-uat/yb-cou/yb-cou-switch
    tag: "main-initial" # Overridden dynamically by Cloud Build
    pullPolicy: IfNotPresent
  port: 3000
  service:
    type: LoadBalancer # "ClusterIP" or "LoadBalancer"
    port: 80
    internalLoadBalancer: true
    loadBalancerIP: "192.168.1.12" # Leave "" for an auto-assigned internal IP
    sessionAffinity: None
    neg:
      enabled: true
      ingress: false
      exposedPortsEnabled: true
  terminationGracePeriodSeconds: 120
  gcpSecretName: yb-cou-switch-uat-env # Synced via External Secrets Operator
  probes:
    livenessPath: /health
    readinessPath: /ready
  resources:
    requests:
      cpu: 200m
      memory: 300Mi
    limits:
      cpu: 200m
      memory: 300Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
  pdb:
    minAvailable: 1






redis:
  enabled: true # Disabled in Prod (use GCP Memorystore); set true in values-uat.yaml
  name: yb-cou-redis
  image: redis:7-alpine
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "100m"
