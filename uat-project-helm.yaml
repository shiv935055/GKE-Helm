global:
  environment: uat
  gcpProjectId: gcp_project_id
  namespace: app_namespace

ingress:
  enabled: true
  name: ingress_name
  className: "gce-internal"
  host: service.plutos.one

backend:
  name: backend-service-name
  reloader: true
  replicaCount: 1
  image:
    repository: asia-south1-docker.pkg.dev/plutos-bbps-uat/helm-repo/csc-bou-auth-dashboard
    tag: "main-initial" # Overridden dynamically by Cloud Build
    pullPolicy: IfNotPresent
  port: 7005
  terminationGracePeriodSeconds: 120
  gcpSecretName: gcp_secret_name # Synced via External Secrets Operator
  probes:
    livenessPath: /v1/readiness/health
    readinessPath: /v1/readiness/ready
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
  pdb:
    minAvailable: 1

frontend:
  name: frontend_svc_name
  replicaCount: 1
  image:
    repository: asia-south1-docker.pkg.dev/plutos-bbps-prod/csc-bou/csc-bou-frontend
    tag: "main-initial"
    pullPolicy: IfNotPresent
  port: 8080 # Non-root Nginx port
  probes:
    livenessPath: /healthz
    readinessPath: /healthz
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  pdb:
    minAvailable: 1

redis:
  enabled: true # Disabled in Prod (use GCP Memorystore); set true in values-uat.yaml
  name: redis_service_name
  image: redis:7-alpine
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  
